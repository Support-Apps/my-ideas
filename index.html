<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הרעיונות שלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=David+Libre:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3d3d3d;
    --ink-soft: #7a7a7a;
    --line: #e4e4e4;
    --bg: #ffffff;
    --tint: #f6f6f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); }
  body {
    font-family: 'David Libre', 'Times New Roman', serif;
    color: var(--ink);
    min-height: 100vh;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 18px 22px 60px; }

  .bsd {
    text-align: right;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-soft);
    letter-spacing: .5px;
  }

  header { text-align: center; padding: 26px 0 30px; }
  h1 {
    font-size: 46px;
    font-weight: 900;
    color: var(--ink);
    line-height: 1.1;
  }
  .sub {
    margin-top: 10px;
    font-size: 17px;
    font-weight: 400;
    color: var(--ink-soft);
  }
  .orn {
    margin: 18px auto 0;
    width: 70px; height: 1px; background: var(--ink-soft);
    position: relative;
  }
  .orn::after {
    content: ''; position: absolute; top: -3px; left: 50%;
    width: 7px; height: 7px; background: var(--bg);
    border: 1px solid var(--ink-soft); transform: translateX(-50%) rotate(45deg);
  }

  form { display: flex; gap: 10px; margin-bottom: 26px; }
  input[type=text] {
    flex: 1; min-width: 0;
    font-family: inherit; font-size: 19px; font-weight: 400;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--ink-soft);
    border-radius: 0;
    padding: 13px 15px;
    outline: none;
  }
  input[type=text]::placeholder { color: #aaa; }
  input[type=text]:focus { border-color: var(--ink); }
  .add {
    font-family: inherit; font-size: 18px; font-weight: 700;
    color: #fff; background: var(--ink);
    border: 1px solid var(--ink); border-radius: 0;
    padding: 0 22px; cursor: pointer;
  }
  .add:active { background: #222; }

  .tabs { display: flex; justify-content: center; gap: 22px; margin-bottom: 8px; }
  .tab {
    font-family: inherit; font-size: 17px; font-weight: 500;
    color: var(--ink-soft); background: none; border: none;
    padding: 6px 2px; cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tab.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 700; }

  ul { list-style: none; }
  li {
    display: flex; align-items: center; gap: 14px;
    padding: 17px 4px;
    border-bottom: 1px solid var(--line);
  }
  .check {
    flex: none; width: 26px; height: 26px;
    border: 1.5px solid var(--ink-soft); background: var(--bg);
    border-radius: 0; cursor: pointer; position: relative;
  }
  li.done .check { background: var(--ink); border-color: var(--ink); }
  li.done .check::after {
    content: ''; position: absolute; top: 3px; right: 8px;
    width: 6px; height: 12px;
    border: solid #fff; border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .txt {
    flex: 1; font-size: 21px; font-weight: 400; line-height: 1.45;
    color: var(--ink); cursor: pointer; word-break: break-word;
  }
  li.done .txt { color: #b0b0b0; text-decoration: line-through; text-decoration-thickness: 1px; }
  .del {
    flex: none; background: none; border: none; cursor: pointer;
    font-family: inherit; font-size: 26px; line-height: 1;
    color: #c4c4c4; padding: 4px 8px;
  }
  .del:hover, .del:active { color: var(--ink); }

  .empty { text-align: center; padding: 48px 10px; font-size: 20px; color: var(--ink-soft); font-weight: 300; }
  .foot {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 22px; font-size: 16px; color: var(--ink-soft);
  }
  .clear {
    font-family: inherit; font-size: 16px; font-weight: 500;
    color: var(--ink-soft); background: none; border: none;
    border-bottom: 1px solid var(--ink-soft); cursor: pointer; padding: 0 0 1px;
  }
  .clear:hover { color: var(--ink); border-color: var(--ink); }
  .hide { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bsd">בס״ד</div>

  <header>
    <h1>הרעיונות שלי</h1>
    <div class="sub">כל רעיון טוב מתחיל ברשימה</div>
    <div class="orn"></div>
  </header>

  <form id="form" autocomplete="off">
    <input type="text" id="inp" placeholder="כתבי רעיון חדש…" maxlength="300" enterkeyhint="done">
    <button class="add" type="submit">הוספה</button>
  </form>

  <div class="tabs" id="tabs">
    <button class="tab on" data-f="all">הכל</button>
    <button class="tab" data-f="open">פתוחים</button>
    <button class="tab" data-f="done">הושלמו</button>
  </div>

  <ul id="list"></ul>
  <div class="empty hide" id="empty"></div>

  <div class="foot hide" id="foot">
    <span id="count"></span>
    <button class="clear" id="clear">נקי את ההושלמים</button>
  </div>
</div>

<script>
(function () {
  var KEY = 'my-ideas-v1';
  var ideas = [];
  var filter = 'all';

  function load() {
    try { ideas = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { ideas = []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(ideas)); } catch (e) {}
  }

  var list = document.getElementById('list');
  var empty = document.getElementById('empty');
  var foot = document.getElementById('foot');
  var count = document.getElementById('count');
  var inp = document.getElementById('inp');

  function render() {
    var shown = ideas.filter(function (i) {
      return filter === 'all' || (filter === 'open' ? !i.done : i.done);
    });
    list.innerHTML = '';
    shown.forEach(function (i) {
      var li = document.createElement('li');
      if (i.done) li.className = 'done';

      var c = document.createElement('button');
      c.className = 'check'; c.type = 'button';
      c.setAttribute('aria-label', 'סימון כהושלם');
      c.onclick = function () { toggle(i.id); };

      var t = document.createElement('span');
      t.className = 'txt'; t.textContent = i.text;
      t.onclick = function () { toggle(i.id); };

      var d = document.createElement('button');
      d.className = 'del'; d.type = 'button'; d.textContent = '×';
      d.setAttribute('aria-label', 'מחיקה');
      d.onclick = function () { remove(i.id); };

      li.appendChild(c); li.appendChild(t); li.appendChild(d);
      list.appendChild(li);
    });

    if (!shown.length) {
      empty.classList.remove('hide');
      empty.textContent = !ideas.length ? 'עוד אין רעיונות. הגיע הזמן לכתוב את הראשון.'
        : filter === 'done' ? 'עדיין לא הושלם אף רעיון.' : 'אין רעיונות פתוחים. כל הכבוד!';
    } else {
      empty.classList.add('hide');
    }

    var open = ideas.filter(function (i) { return !i.done; }).length;
    var done = ideas.length - open;
    if (ideas.length) {
      foot.classList.remove('hide');
      count.textContent = open + ' פתוחים · ' + done + ' הושלמו';
      document.getElementById('clear').style.visibility = done ? 'visible' : 'hidden';
    } else {
      foot.classList.add('hide');
    }
  }

  function toggle(id) {
    ideas.forEach(function (i) { if (i.id === id) i.done = !i.done; });
    save(); render();
  }
  function remove(id) {
    ideas = ideas.filter(function (i) { return i.id !== id; });
    save(); render();
  }

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = inp.value.trim();
    if (!v) return;
    ideas.unshift({ id: Date.now() + Math.random(), text: v, done: false });
    inp.value = '';
    if (filter === 'done') setFilter('all');
    save(); render();
  });

  document.getElementById('clear').onclick = function () {
    ideas = ideas.filter(function (i) { return !i.done; });
    save(); render();
  };

  function setFilter(f) {
    filter = f;
    document.querySelectorAll('.tab').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-f') === f);
    });
  }
  document.getElementById('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('.tab');
    if (!b) return;
    setFilter(b.getAttribute('data-f'));
    render();
  });

  load(); render();
})();
</script>
</body>
</html>
